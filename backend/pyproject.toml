[project]
name = "robot-studio-backend"
version = "0.1.0"
description = "Robot Studio backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "aiosqlite>=0.20.0",
    "watchdog>=6.0.0",
    "robotframework>=7.0.0",
    "jedi>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.scripts]
robot-studio-backend = "robot_studio.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["robot_studio*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
